<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>ESL Town Navigator</title>
    <style>
        body { font-family: 'Comic Sans MS', cursive; background: #2d3436; color: white; display: flex; flex-direction: column; align-items: center; margin: 0; overflow: hidden; }
        
        #menu-overlay { 
            position: fixed; top: 0; left: 0; width: 100%; height: 100%; 
            background: rgba(45, 52, 54, 0.95); z-index: 1000; 
            display: flex; flex-direction: column; justify-content: center; align-items: center; 
        }
        .menu-card { background: white; padding: 40px; border-radius: 15px; text-align: center; color: #333; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        
        #ui { background: white; color: #333; padding: 15px; width: 100%; text-align: center; box-shadow: 0 4px 10px rgba(0,0,0,0.3); z-index: 10; }
        #city-map { position: relative; width: 700px; height: 800px; background: #95a5a6; margin: 20px; border: 8px solid #636e72; border-radius: 8px; }
        .building { position: absolute; background: white; border: 2px solid #2d3436; display: flex; flex-direction: column; justify-content: center; align-items: center; color: #2d3436; font-weight: bold; font-size: 13px; border-radius: 6px; text-align: center; }
        .icon { font-size: 40px; margin-bottom: 5px; }
        .door { position: absolute; background: #795548; }
        .door-h { width: 24px; height: 8px; }
        .door-v { width: 8px; height: 24px; }
        .street-name { position: absolute; font-size: 11px; color: #dfe6e9; text-transform: uppercase; font-weight: bold; letter-spacing: 1px; pointer-events: none; }
        #player { position: absolute; width: 24px; height: 24px; background: #e17055; border: 2px solid white; border-radius: 50%; z-index: 100; display: flex; justify-content: center; align-items: center; font-size: 16px; transition: left 0.1s, top 0.1s; }
        
        .btn { border: none; padding: 12px 25px; border-radius: 5px; cursor: pointer; font-weight: bold; font-size: 1.1em; margin: 5px; transition: 0.2s; }
        .btn-mode { background: #0984e3; color: white; width: 250px; display: block; margin: 10px auto; }
        #btn-new { background: #00b894; color: white; }
        #btn-retry { background: #f39c12; color: white; display: none; }
        .btn:hover { transform: scale(1.05); opacity: 0.9; }

        /* Floating back button for Free Roam */
        #floating-back {
            position: absolute; top: 10px; right: 10px; padding: 5px 10px; 
            background: rgba(0,0,0,0.5); color: white; border-radius: 5px; 
            cursor: pointer; font-size: 12px; z-index: 200; display: none;
        }
    </style>
</head>
<body>

<div id="menu-overlay">
    <div class="menu-card">
        <h1>Town Navigator</h1>
        <p>Choose your game mode:</p>
        <button class="btn btn-mode" onclick="initGame('challenge')">With Instructions (Solo)</button>
        <button class="btn btn-mode" onclick="initGame('free')">Without Instructions (Pair Work)</button>
    </div>
</div>

<div id="ui">
    <div id="mission-text" style="font-size: 1.2em; min-height: 50px; margin-bottom: 10px;">Click "New Mission" to start!</div>
    <div id="controls">
        <button id="btn-new" class="btn" onclick="startMission()">New Mission</button>
        <button id="btn-retry" class="btn" onclick="resetPlayer()">Try Again</button>
        <button class="btn" style="background: #636e72; color: white;" onclick="location.reload()">Menu</button>
    </div>
</div>

<div id="city-map">
    <div id="floating-back" onclick="location.reload()">↩ Back to Menu</div>

    <div class="street-name" style="top: 140px; left: 320px;">High Street</div>
    <div class="street-name" style="top: 310px; left: 320px;">Market Street</div>
    <div class="street-name" style="top: 480px; left: 320px;">Garden Road</div>
    <div class="street-name" style="top: 350px; left: 165px; transform: rotate(-90deg);">River Road</div>
    <div class="street-name" style="top: 350px; right: 165px; transform: rotate(90deg);">Green Street</div>

    <div class="building" id="hospital" style="top: 10px; left: 20px; width: 130px; height: 110px;"><span class="icon">🏥</span>Hospital<div class="door door-v" style="right:-4px; top:43px;"></div></div>
    <div class="building" id="bank" style="top: 10px; left: 285px; width: 130px; height: 110px;"><span class="icon">🏦</span>Bank<div class="door door-h" style="bottom:-4px; left:53px;"></div></div>
    <div class="building" id="mall" style="top: 10px; right: 20px; width: 130px; height: 110px;"><span class="icon">🛍️</span>Shopping Centre<div class="door door-v" style="left:-4px; top:43px;"></div></div>
    <div class="building" id="theatre" style="top: 180px; left: 20px; width: 130px; height: 110px;"><span class="icon">🎭</span>Theatre<div class="door door-h" style="top:-4px; left:53px;"></div></div>
    <div class="building" id="park" style="top: 180px; left: 285px; width: 130px; height: 110px; background: #55efc4;"><span class="icon">🌳</span>Park</div>
    <div class="building" id="cinema" style="top: 180px; right: 20px; width: 130px; height: 110px;"><span class="icon">🎬</span>Cinema<div class="door door-h" style="top:-4px; left:53px;"></div></div>
    <div class="building" id="bookshop" style="top: 350px; left: 20px; width: 130px; height: 110px;"><span class="icon">📚</span>Bookshop<div class="door door-v" style="right:-4px; top:43px;"></div></div>
    <div class="building" id="library" style="top: 350px; left: 285px; width: 130px; height: 110px;"><span class="icon">📖</span>Library<div class="door door-h" style="bottom:-4px; left:53px;"></div></div>
    <div class="building" id="sports" style="top: 350px; right: 20px; width: 130px; height: 110px;"><span class="icon">⚽</span>Sports Centre<div class="door door-v" style="left:-4px; top:43px;"></div></div>
    <div class="building" id="toyshop" style="top: 520px; left: 20px; width: 130px; height: 110px;"><span class="icon">🧸</span>Toy Shop<div class="door door-h" style="top:-4px; left:53px;"></div></div>
    <div class="building" id="cafe" style="top: 520px; left: 285px; width: 130px; height: 110px;"><span class="icon">☕</span>Café<div class="door door-h" style="top:-4px; left:53px;"></div></div>
    <div class="building" id="petshop" style="top: 520px; right: 20px; width: 130px; height: 110px;"><span class="icon">🐶</span>Pet Shop<div class="door door-h" style="top:-4px; left:53px;"></div></div>

    <div id="player">👤</div>
    <div style="position: absolute; top: 680px; left: 335px; color: #d63031; font-weight: bold;">START</div>
</div>

<script>
    const player = document.getElementById('player');
    const missionText = document.getElementById('mission-text');
    const btnNew = document.getElementById('btn-new');
    const btnRetry = document.getElementById('btn-retry');
    const menu = document.getElementById('menu-overlay');
    const ui = document.getElementById('ui');
    const floatingBack = document.getElementById('floating-back');

    let pX = 338, pY = 650, targetId = "", currentMission = "";
    let missionPool = [];
    let gameMode = "";

    const baseMissions = [
        { id: "mall", text: "Take the first street on your right. Then go straight on. It is the fourth building on your right." },
        { id: "hospital", text: "Take the first street on your left and go straight to the very end of the road. It's the last building on your left." },
        { id: "cafe", text: "Take the first street on your left and turn right. It's immediately on your right." },
        { id: "toyshop", text: "Take the first street on your left and take the first street on your left. It's the building on your left." },
        { id: "petshop", text: "Take the first street on your right and take the first street on your right. It's the building on your right." },
        { id: "library", text: "Take the first street on your left and take the first on your right. It's the first building on your left." },
        { id: "sports", text: "Take the first street on your right and go straight. It's the second building on your right." },
        { id: "bookshop", text: "Take the first street on your left and go straight. It's the second building on your left." },
        { id: "bank", text: "Take the first street on your left and go straight ahead. Take the third one on your right. It's the first building on your left." },
        { id: "theatre", text: "Take the first street on your left and take the third street on your left. It's on your left." },
        { id: "cinema", text: "Take the first street on your right and go straight ahead. Take the third street on your right. It's right here." }
    ];

    function initGame(mode) {
        gameMode = mode;
        menu.style.display = 'none';
        
        if (gameMode === 'free') {
            ui.style.display = 'none'; // REMOVE WHITE BOX
            floatingBack.style.display = 'block'; // Show small back button
            targetId = "free-roam"; 
            document.getElementById('city-map').style.marginTop = '40px';
        } else {
            ui.style.display = 'block';
            floatingBack.style.display = 'none';
            shuffleMissions();
        }
    }

    function shuffleMissions() {
        missionPool = [...baseMissions];
        for (let i = missionPool.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [missionPool[i], missionPool[j]] = [missionPool[j], missionPool[i]];
        }
    }

    function updateUI() { 
        player.style.left = pX + 'px'; 
        player.style.top = pY + 'px'; 
    }

    function canMove(x, y) {
        const buildings = document.querySelectorAll('.building');
        const mapRect = document.getElementById('city-map').getBoundingClientRect();
        if (x < 0 || x > 675 || y < 0 || y > 775) return false;
        for (let b of buildings) {
            const r = b.getBoundingClientRect();
            const bL = r.left - mapRect.left, bR = r.right - mapRect.left, bT = r.top - mapRect.top, bB = r.bottom - mapRect.top;
            if (x + 22 > bL && x < bR && y + 22 > bT && y < bB) {
                const door = b.querySelector('.door');
                if (!door) return false;
                const dR = door.getBoundingClientRect();
                if (x+22 > dR.left - mapRect.left && x < dR.right - mapRect.left && y+22 > dR.top - mapRect.top && y < dR.bottom - mapRect.top) return true;
                return false; 
            }
        }
        return true;
    }

    window.addEventListener('keydown', (e) => {
        if (!targetId || !["ArrowUp", "ArrowDown", "ArrowLeft", "ArrowRight"].includes(e.key)) return;
        let nX = pX, nY = pY, step = 15;
        if (e.key === 'ArrowUp') nY -= step;
        if (e.key === 'ArrowDown') nY += step;
        if (e.key === 'ArrowLeft') nX -= step;
        if (e.key === 'ArrowRight') nX += step;
        if (canMove(nX, nY)) { 
            pX = nX; pY = nY; 
            updateUI(); 
            if (gameMode === 'challenge') checkArrival(); 
        }
    });

    function startMission() {
        if (missionPool.length === 0) shuffleMissions();
        const m = missionPool.pop();
        targetId = m.id; 
        currentMission = m.text;
        missionText.innerHTML = `<i>"${currentMission}"</i>`;
        missionText.style.color = "#0984e3";
        btnNew.style.display = "none";
        btnRetry.style.display = "none";
        resetPlayer();
    }

    function resetPlayer() {
        pX = 338; pY = 650; updateUI();
        btnRetry.style.display = "none";
        if (gameMode === 'challenge' && currentMission) {
            missionText.innerHTML = `<i>"${currentMission}"</i>`;
            missionText.style.color = "#0984e3";
        }
    }

    function checkArrival() {
        if (!targetId || gameMode === 'free') return;
        const mapRect = document.getElementById('city-map').getBoundingClientRect();
        const buildings = document.querySelectorAll('.building');

        buildings.forEach(b => {
            const r = b.getBoundingClientRect();
            const bL = r.left - mapRect.left, bR = r.right - mapRect.left, bT = r.top - mapRect.top, bB = r.bottom - mapRect.top;

            if (pX + 11 > bL && pX + 11 < bR && pY + 11 > bT && pY + 11 < bB) {
                if (b.id === targetId) {
                    missionText.innerHTML = "✅ <b>EXCELLENT!</b> Mission Accomplished!";
                    missionText.style.color = "#27ae60";
                    targetId = ""; 
                    btnNew.style.display = "inline-block";
                    btnRetry.style.display = "none";
                } else if (b.id !== "park") {
                    missionText.innerHTML = "❌ <b>WRONG!</b> This is the " + b.id.toUpperCase();
                    missionText.style.color = "#d63031";
                    btnRetry.style.display = "inline-block";
                }
            }
        });
    }

    updateUI();
</script>
</body>
</html>
